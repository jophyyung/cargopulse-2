[project]
name = "cargopulse"
version = "0.1.0"
description = "Synthetic-only, read-only air cargo recovery decision support"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.2", "pydantic==2.14.3", "sqlalchemy==2.1.8",
  "alembic==1.20.1", "highspy==1.15.1", "psycopg[binary]==3.3.8",
  "redis==8.1.0", "PyJWT[crypto]==2.15.1", "authlib==1.9.5",
  "uvicorn==0.54.0", "httpx==0.28.1", "python-multipart==0.0.33",
  "boto3==1.43.127", "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "hypothesis==6.170.15", "ruff==0.17.4", "pip-audit==2.10.1"]

[tool.pytest.ini_options]
pythonpath = ["packages/contracts/python", "services/api", "services/worker", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL and Redis", "security: adversarial authorization checks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Developer-only fixed `git rev-parse HEAD`; no HTTP or user-supplied arguments.
"services/worker/cargopulse_optimizer/benchmark.py" = ["S607"]
# Reproducible synthetic fixtures use seeded randomness; no credentials use it.
"packages/domain_fixtures/generator.py" = ["S311"]
